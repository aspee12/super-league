name: Setup project
description: Install Node + Yarn Berry and restore the dependency cache.

inputs:
  node-version:
    description: >-
      Node.js version to install. Keep this in sync with the Vercel project's
      Settings -> Build & Deployment -> Node.js Version, otherwise CI can pass
      on a runtime that production never uses.
    required: false
    default: '22.x'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Corepack pins Yarn to the `packageManager` field in package.json (4.x).
    # Enabling it after setup-node matters: the shims are written into the
    # Node install that setup-node just provisioned.
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Resolve Yarn cache directory
      id: yarn-cache
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    # --immutable fails the build if yarn.lock does not match package.json,
    # instead of silently rewriting the lockfile.
    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
